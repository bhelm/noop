# Compile-and-test verification for the reusable Swift packages.
#
# This job intentionally does NOT touch the macOS app target: that build needs
# XcodeGen to generate Strand.xcodeproj and a wired-up test scheme, and the app
# release is produced and anonymized by hand. The packages, by contrast, build
# and test on their own with plain SwiftPM — no Xcode project, no signing, no
# secrets — which makes them a safe, self-contained CI check that leaks nothing.
name: Swift Packages CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'Packages/**'
      - 'Tools/SleepBench/**'
      - 'Tools/SleepPSG/**'
      - 'Tools/Backfill/**'
      - '.github/workflows/swift-packages.yml'
  push:
    branches: [main]
    paths:
      - 'Packages/**'
      - 'Tools/SleepBench/**'
      - 'Tools/SleepPSG/**'
      - 'Tools/Backfill/**'
      - '.github/workflows/swift-packages.yml'
  workflow_dispatch:

concurrency:
  group: swift-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-strand-analytics:
    runs-on: ubuntu-24.04
    env:
      SQLITE_SNAPSHOT_DIR: ${{ github.workspace }}/.ci/sqlite-snapshot
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Log Swift version
        run: swift --version

      - name: Restore snapshot SQLite
        id: sqlite-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.SQLITE_SNAPSHOT_DIR }}
          key: sqlite-snapshot-3.53.4-${{ runner.os }}-${{ runner.arch }}-b1dd5d74

      - name: Build snapshot SQLite
        if: steps.sqlite-cache.outputs.cache-hit != 'true'
        env:
          SQLITE_AMALGAMATION_SHA256: b1dd5d74ec7f29055a6684fa06fb3c2f6821c87dd38f9a458dfd2e8a1db28189
        run: |
          archive="$RUNNER_TEMP/sqlite-amalgamation-3530400.zip"
          source="$RUNNER_TEMP/sqlite3.c"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://sqlite.org/2026/sqlite-amalgamation-3530400.zip \
            --output "$archive"
          unzip -p "$archive" sqlite-amalgamation-3530400/sqlite3.c > "$source"
          echo "$SQLITE_AMALGAMATION_SHA256  $source" | sha256sum --check --strict
          mkdir -p "$SQLITE_SNAPSHOT_DIR"
          gcc -shared -fPIC -DSQLITE_ENABLE_SNAPSHOT=1 "$source" \
            -o "$SQLITE_SNAPSHOT_DIR/libsqlite3.so.0"
          ln -s libsqlite3.so.0 "$SQLITE_SNAPSHOT_DIR/libsqlite3.so"

      - name: Build StrandAnalytics
        run: swift build -Xlinker "-L${SQLITE_SNAPSHOT_DIR}"
        working-directory: Packages/StrandAnalytics

      - name: Test StrandAnalytics
        env:
          LD_LIBRARY_PATH: ${{ env.SQLITE_SNAPSHOT_DIR }}
        run: swift test -Xlinker "-L${SQLITE_SNAPSHOT_DIR}"
        working-directory: Packages/StrandAnalytics

  test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package:
          - WhoopProtocol
          - OuraProtocol
          - PolarProtocol
          - WhoopStore
          - StrandAnalytics
          - StrandImport
          - StrandDesign
          - NoopLocalAccess
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build ${{ matrix.package }}
        run: swift build
        working-directory: Packages/${{ matrix.package }}

      - name: Test ${{ matrix.package }}
        run: swift test
        working-directory: Packages/${{ matrix.package }}

  # The Tools/ SwiftPM packages, which path-depend on Packages/ above and were built by nothing.
  #
  # SleepBench is the instrument the sleep work is argued with — #934's stage-fraction tables came out of
  # it — and #935 added 13 tests that no job ran. A tool whose numbers decide whether a staging change
  # lands has to keep compiling against the packages it measures, or it bitrots silently and the next
  # person to reach for it finds it broken. Backfill has no tests yet, so it is build-only.
  #
  # SleepPSG has a second, sharper reason to be here. Its variant scores run through a knob-for-knob PORT of
  # `SleepStagerV2`, and its test suite is what proves that port still reproduces the shipped stager
  # label-for-label. Without this job the port drifts the first time someone edits a coefficient, and the
  # tool keeps printing confident numbers about a recipe that no longer exists. The check needs no dataset.
  tools:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        tool:
          - SleepBench
          - SleepPSG
          - Backfill
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build ${{ matrix.tool }}
        run: swift build
        working-directory: Tools/${{ matrix.tool }}

      # Only SleepBench has a test target; `swift test` on a package without one fails, so it is guarded.
      - name: Test ${{ matrix.tool }}
        run: |
          if grep -q 'testTarget' Package.swift; then
            swift test
          else
            echo "no test target in Tools/${{ matrix.tool }} — build-only"
          fi
        working-directory: Tools/${{ matrix.tool }}
