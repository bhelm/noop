# The parity suite rescans every Swift/Kotlin file that can affect its inventory,
# attached references, or lexical production/test call graph. Keep these paths in
# sync with parity_ledger.py's REFERENCE_GLOBS plus the governance implementation
# and metadata. Pure docs and unrelated assets do not need this multi-minute suite.
name: Parity Governance CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'Tools/PARITY_GOVERNANCE.md'
      - 'Tools/issue_ref.py'
      - 'Tools/parity_*.py'
      - 'Tools/parity_*.json'
      - 'Tools/tests/**'
      - '.github/workflows/parity-governance.yml'
      - 'Packages/**/*.swift'
      - 'Strand/**/*.swift'
      - 'StrandTests/**/*.swift'
      - 'StrandiOS*/**/*.swift'
      - 'NOOPWatch*/**/*.swift'
      - 'android/**/*.kt'
  push:
    branches: [main]
    paths:
      - 'Tools/PARITY_GOVERNANCE.md'
      - 'Tools/issue_ref.py'
      - 'Tools/parity_*.py'
      - 'Tools/parity_*.json'
      - 'Tools/tests/**'
      - '.github/workflows/parity-governance.yml'
      - 'Packages/**/*.swift'
      - 'Strand/**/*.swift'
      - 'StrandTests/**/*.swift'
      - 'StrandiOS*/**/*.swift'
      - 'NOOPWatch*/**/*.swift'
      - 'android/**/*.kt'
  workflow_dispatch:

concurrency:
  group: parity-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run parity-governance tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee "$RUNNER_TEMP/out.txt"
          ran=$(grep -oE '^Ran [0-9]+ test' "$RUNNER_TEMP/out.txt" | grep -oE '[0-9]+')
          echo "collected ${ran:-0} tests"
          if [ "${ran:-0}" -lt 102 ]; then
            echo "::error::expected at least 102 parity-governance tests, collected ${ran:-0} — discovery is broken, not the suite"
            exit 1
          fi
        working-directory: Tools
